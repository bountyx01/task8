x-runtime: &runtime
  user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  cpus: 2
  mem_limit: 2g
  pids_limit: 256

services:
  workbench:
    <<: *runtime
    build: ./workbench
    image: standoff-workbench-web:1.0
    env_file: ./workbench/workbench.env
    ports:
      - "127.0.0.1:${WEB_PORT:-8077}:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - bench_logs:/var/log/workbench
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    <<: *runtime
    image: postgres:18-alpine3.23
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      JUDGE_USER: ${JUDGE_USER:?}
      JUDGE_PASSWORD: ${JUDGE_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /tmp
      - /var/run/postgresql:mode=1777
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  bench_logs:
